<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="description" content="Autonomous 2D Top-Down Restaurant Simulator PWA with Phaser 3 and AI Management" />
    <link rel="manifest" href="/manifest.json" />
    <title>ChefAI: Autonomous Restaurant Simulator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-slate-100 overflow-hidden select-none font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // updateViaCache: 'none' stops the browser's HTTP cache from ever
          // shadowing sw.js itself, so version checks always see the real file.
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((registration) => {
            // Proactively re-check for a new service worker whenever the tab
            // regains focus, instead of waiting for the next hard navigation.
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') registration.update();
            });
          }).catch(err => {
            console.log('SW registration skipped or failed:', err);
          });

          // Once a new service worker takes control (it calls skipWaiting +
          // clients.claim on activate), reload so the tab actually picks up
          // the fresh index.html and hashed assets instead of updating silently.
          let refreshingAfterUpdate = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshingAfterUpdate) return;
            refreshingAfterUpdate = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
